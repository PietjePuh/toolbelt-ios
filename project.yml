# XcodeGen spec.
#
# The project file is GENERATED from this, deliberately: a checked-in
# .xcodeproj is an opaque pbxproj that conflicts badly and hides what changed.
# This is reviewable text. CI runs `xcodegen generate` before building.
#
# Regenerate locally (on a Mac):  brew install xcodegen && xcodegen generate
name: Toolbelt
options:
  bundleIdPrefix: nl.pietjepuh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Keep the generated project out of git; project.yml is the source of truth.
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    # No team is set: builds are UNSIGNED. AltStore/SideStore resign on
    # install, and CI has no certificate. Setting a team here would break the
    # build for everyone who is not the author.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  # Official VLC for iOS framework. Chosen over AVPlayer because it plays
  # essentially any container/codec without transcoding — which is the entire
  # reason to have a separate player rather than using the system one.
  VLCKit:
    url: https://github.com/videolan/vlckit
    from: "4.0.0a2"

targets:
  Toolbelt:
    type: application
    platform: iOS
    dependencies:
      - package: VLCKit
    sources:
      - path: App
        excludes:
          - "README.md"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Toolbelt
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Audio is an APPROVED background mode, so playback continues with the
        # screen off. There is deliberately no `fetch` or `processing` mode
        # here: downloads do not get an exemption, and declaring one we cannot
        # honour would be a lie to both the user and the OS.
        UIBackgroundModes:
          - audio
        # The scanner and feeds talk to arbitrary third-party hosts over
        # HTTPS. No ATS exception is declared: everything this app fetches
        # must be https, and a host that cannot do TLS is a result worth
        # reporting rather than working around.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.pietjepuh.toolbelt
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  ToolbeltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Toolbelt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Toolbelt:
    build:
      targets:
        Toolbelt: all
        ToolbeltTests: [test]
    test:
      targets:
        - ToolbeltTests
